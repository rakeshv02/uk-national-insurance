<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK National Insurance Calculator 2025/26 | Tabutility</title>
  <meta name="description" content="Calculate UK National Insurance contributions for employees, self-employed and employers. 2025/26 rates including Class 1, 2, 4 and employer NI." />
  <meta name="keywords" content="national insurance calculator, uk ni calculator, class 1 ni, class 4 ni, employer national insurance 2025" />
  <link rel="canonical" href="https://uk-national-insurance.tabutility.com/" />
  <meta property="og:title" content="UK National Insurance Calculator 2025/26" />
  <meta property="og:description" content="Calculate Class 1, Class 4 and employer NI contributions for 2025/26." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇬🇧</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return '£'+Math.round(n).toLocaleString('en-GB');}

function App() {
  const [salary, setSalary] = useState(55000);
  const [type, setType] = useState('employed');

  const s = Number(salary)||0;

  // Employee Class 1 NI 2025/26
  // Primary threshold £12,570, upper earnings limit £50,270
  const PT = 12570, UEL = 50270;
  const empNI = s > PT
    ? Math.min(s, UEL) * 0.08 - PT * 0.08 + Math.max(0, s - UEL) * 0.02
    : 0;

  // Employer NI 2025/26 — secondary threshold £5,000, rate 15%
  const ST = 5000;
  const erNI = s > ST ? (s - ST) * 0.15 : 0;
  const totalCost = s + erNI;

  // Self-employed Class 2 & 4 NI 2025/26
  // Class 4: 6% on £12,570–£50,270, 2% above
  const class4 = s > PT
    ? Math.min(s, UEL) * 0.06 - PT * 0.06 + Math.max(0, s - UEL) * 0.02
    : 0;
  // Class 2: £3.45/week if profits > £12,570 (small profits threshold)
  const class2 = s > 6725 ? 3.45 * 52 : 0;

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#003087,#012169)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🇬🇧</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>UK National Insurance</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>2025/26 — Employee · Employer · Self-employed</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Annual {type==='employed'?'Salary':'Profit'}</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>£</span>
              <input type="number" value={salary} onChange={e=>setSalary(e.target.value)}
                style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            {[['employed','Employed'],['self_employed','Self-Employed']].map(([v,l])=>(
              <button key={v} onClick={()=>setType(v)} style={{flex:1,padding:'10px',borderRadius:10,border:`2px solid ${type===v?'#003087':'#e5e7eb'}`,background:type===v?'#003087':'#fff',color:type===v?'#fff':'#374151',fontWeight:600,cursor:'pointer',fontSize:13}}>{l}</button>
            ))}
          </div>
        </div>

        {type === 'employed' ? (
          <>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
              <div style={{background:'#eff6ff',borderRadius:14,padding:16,textAlign:'center'}}>
                <div style={{fontSize:11,fontWeight:700,color:'#1e40af'}}>YOU PAY (Class 1)</div>
                <div style={{fontSize:30,fontWeight:900,color:'#1d4ed8',margin:'6px 0'}}>{fmt(empNI)}</div>
                <div style={{fontSize:11,color:'#6b7280'}}>{s>0?(empNI/s*100).toFixed(1):'0'}% of salary</div>
              </div>
              <div style={{background:'#fef3c7',borderRadius:14,padding:16,textAlign:'center'}}>
                <div style={{fontSize:11,fontWeight:700,color:'#92400e'}}>EMPLOYER PAYS</div>
                <div style={{fontSize:30,fontWeight:900,color:'#b45309',margin:'6px 0'}}>{fmt(erNI)}</div>
                <div style={{fontSize:11,color:'#6b7280'}}>Total cost: {fmt(totalCost)}</div>
              </div>
            </div>
            <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
              {[
                ['Salary', fmt(s)],
                ['Primary Threshold', '£12,570'],
                ['Upper Earnings Limit', '£50,270'],
                ['Employee NI (Class 1)', fmt(empNI)+' @ 8%/2%'],
                ['Employer NI (Class 1)', fmt(erNI)+' @ 15%'],
                ['Employer Secondary Threshold', '£5,000'],
                ['Total Employer Cost', fmt(totalCost)],
              ].map(([l,v])=>(
                <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
                  <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
                </div>
              ))}
            </div>
          </>
        ) : (
          <>
            <div style={{background:'#f0fdf4',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:'#166534'}}>TOTAL NI (Class 2 + 4)</div>
              <div style={{fontSize:44,fontWeight:900,color:'#16a34a',margin:'6px 0'}}>{fmt(class2+class4)}</div>
            </div>
            <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
              {[
                ['Profit', fmt(s)],
                ['Class 2 (£3.45/week)', fmt(class2)+' ('+Math.round(class2/3.45)+' weeks)'],
                ['Class 4 (6% / 2%)', fmt(class4)],
                ['Total NI Contributions', fmt(class2+class4)],
                ['Effective Rate', s>0?((class2+class4)/s*100).toFixed(1)+'%':'0%'],
              ].map(([l,v])=>(
                <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
                  <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
                </div>
              ))}
            </div>
          </>
        )}
        <div style={{background:'#eff6ff',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#1e3a8a',lineHeight:1.6}}>
          <strong>2025/26 rates:</strong> Employee Class 1: 8% on £12,570–£50,270, 2% above. Employer: 15% on salary above £5,000. Self-employed Class 4: 6% on £12,570–£50,270, 2% above. Class 2: £3.45/week if profit &gt; £6,725.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
